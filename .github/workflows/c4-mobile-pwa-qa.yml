name: c4-mobile-pwa-qa

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  mobile-pwa:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install
        run: npm ci --no-audit --no-fund

      - name: Verify C4 contract
        run: npm run check:c4

      - name: Install mobile browser engines
        run: npx playwright install --with-deps chromium webkit

      - name: Run production-mode mobile PWA emulation
        run: npm run qa:c4:emulation

      - name: Upload C4 failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: c4-mobile-pwa-${{ github.run_id }}
          path: |
            playwright-report-c4
            test-results
          if-no-files-found: ignore
          retention-days: 30

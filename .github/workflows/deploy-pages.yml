name: Deploy Pages

on:
  workflow_run:
    workflows: ["verify"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: go-pages-production
  cancel-in-progress: false

jobs:
  build:
    if: >
      (github.event_name == 'workflow_dispatch') ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Resolve release SHA
        id: release
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_run" ]; then
            echo "sha=${{ github.event.workflow_run.head_sha }}" >> "$GITHUB_OUTPUT"
          else
            echo "sha=${{ github.sha }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ steps.release.outputs.sha }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install
        run: npm ci --no-audit --no-fund

      - name: Build production site
        run: npm run build
        env:
          THIEPN_RELEASE_SHA: ${{ steps.release.outputs.sha }}
          VITE_KATAGO_API_BASE: ${{ vars.KATAGO_API_BASE }}

      - name: Verify release baseline
        run: |
          npm run check:platform
          npm run check:release

      - name: Verify deploy artifact
        shell: bash
        run: |
          test -f dist/index.html
          test -f dist/sw.js
          test -f dist/manifest.webmanifest
          test -f dist/release.json

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Deploy Go
        id: deployment
        uses: actions/deploy-pages@v4

name: verify

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install
        run: npm install --no-audit --no-fund

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Check production bundle budget
        run: npm run check:bundle

      - name: Check server analysis runtime
        run: npm run check:server

      - name: Check production platform
        run: npm run check:platform

      - name: Check responsive accessibility invariants
        run: npm run check:a11y

# THIEPN Go - KataGo analysis engine baseline.
# Tune threads/batching for the actual CPU/GPU host.

logToStderr = true
logSearchInfo = false
logAllRequests = false
logAllResponses = false

# P11 normalizes values assuming side-to-move perspective.
reportAnalysisWinratesAs = SIDETOMOVE

# Queries normally override maxVisits.
maxVisits = 500

# Conservative defaults that run on modest hosts.
numAnalysisThreads = 2
numSearchThreadsPerAnalysisThread = 2
nnMaxBatchSize = 8
numNNServerThreadsPerModel = 2
nnCacheSizePowerOfTwo = 20
